plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // 8.0.1 is the newest ASM the agent cannot link against:
    // every visitor the agent builds is created at API level `Opcodes.ASM9`,
    // which ASM 8 and below reject with `IllegalArgumentException: Unsupported api 589824`.
    // Unless the agent's own ASM is hidden from the application -- by relocation or by classloader
    // isolation -- the agent resolves `org.objectweb.asm.*` from here, because the application class
    // path wins over the appended `-javaagent` jar, and then instruments nothing.
    // Anything from 9.0 on accepts `ASM9` and would make this test vacuous.
    testImplementation 'org.ow2.asm:asm-commons:8.0.1'
    testImplementation 'org.ow2.asm:asm-util:8.0.1'
}

test {
    useJUnit()
}
