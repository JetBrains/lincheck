# Real-world projects the trace-recorder and live-debugger integration tests run the agents against,
# each pinned to an exact commit (full 40-char SHA) and fetched as a GitHub source archive
# (`<repository>/archive/<ref>.zip`) into `build/integrationTestProjects/<name>/`.
#
# The single home of these pins. Entry shape: `<name>.repository=<GitHub URL>` plus `<name>.ref=<sha>`,
# where `<name>` is the repository name and the directory the tests find the sources under.
# Read by buildSrc's TraceAgentIntegrationTestsTasks.kt (the `traceAgentIntegrationTestsPrerequisites` tasks),
# and by a CI build that may pre-fetch the archives once and hand them over via the
# `LINCHECK_TEST_PROJECT_ARCHIVES` environment variable — a directory of `<name>-<ref>.zip` files.
fetch=archive

